# trajopt.yaml — mrs_trajopt 노드 파라미터(method.modules.trajopt.*).
#
# 🔴 아래 열 개 키 전부가 오늘 [값 부재]다 — 어느 정본 문서에도 실제 숫자가
# 없다(확인: 255_trajopt_canon_brief.md·256a~c_trajopt_canon_*.md·
# 20d_impl_trajopt*.md 전수 grep, "a_max ="류 대입 0건). 존재하는 숫자는
# mrs_trajopt 자신의 **단위 시험 픽스처**뿐(예: test/core/test_startup_checks.cpp:26-37,
# test_control_tick_service.cpp:32-47) — 그 값은 "이 시험 케이스가 이 숫자로
# 성립을 보인다"는 뜻이지 "이 값이 시스템의 정본 파라미터"라는 뜻이 아니다.
# 시험 픽스처를 config로 옮기면 검증되지 않은 물리·설계 상수가 실행 경로에
# 들어간다 — 지어내지 않는다.
#
# 결과: trajopt_node가 `/robot_specs`를 받는 순간 core::StartupChecks::run이
# SU01/SU02(주기 >= 1)·SU03-05(예산 >= 1)에서 거절하고 ContractViolation →
# 종료 1을 낸다(SU01/02/03/04/05는 node의 하드코드 기본값 0을 그대로 본다 —
# 이 파일이 오버라이드하지 않으므로). **이것은 이번 라운드가 숨기지 않고
# 그대로 보고하는 스모크의 정지점이다** (361_integration_p3p4.md §1).

trajopt_node:
  ros__parameters:
    method:
      modules:
        trajopt:
          # a_max·j_max·min_separation_m·omega_max_radps·yaw_accel_max_radps2 —
          # [값 부재]. 물리 한계(가속도·저크·최소 이격·각속도·각가속도) — 정본
          # 문서 어디에도 숫자가 없다.
          # traj_replan_period_ticks(n^traj, SU01)·subgoal_replan_period_trajcycles
          # (n^re, SU02)·round_cap_budget(SU03)·backtrack_budget(SU04)·
          # peer_board_rounds_max(SU05) — [값 부재]. 전부 >=1이어야 StartupChecks가
          # 통과하는데(startup_checks.hpp 파일 주석) 정본 수치가 없다.
          #
          # 값이 정해지면(module-researcher@trajopt + 사용자, 사전등록 절차) 이
          # 자리에 다음 열 키를 채운다 — 지금은 키조차 두지 않는다(죽은 키 방지,
          # mapf.yaml과 같은 원칙):
          #   a_max, j_max, min_separation_m, omega_max_radps,
          #   yaw_accel_max_radps2, traj_replan_period_ticks,
          #   subgoal_replan_period_trajcycles, round_cap_budget,
          #   backtrack_budget, peer_board_rounds_max
          placeholder: true  # YAML 파서가 빈 mapping을 거부하지 않도록 하는 무의미 키.
                              # trajopt_node는 이 이름의 파라미터를 읽지 않는다.
