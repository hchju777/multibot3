# =============================================================================
#  🔴 탐색용 임시값 — 사전등록 상수가 아니다
# =============================================================================
#  375_observation_publisher.md (48차 웨이브 4-A) — `mrs_sim/observation_node`가
#  읽는 센서 범위·분해능·갱신율이다. U48-1(`_workspace/356`)이 "로봇별 유한 범위
#  관측"으로 확정하면서 만든 [값 부재] 셋(센서 범위·각 분해능·갱신율)이 이 파일의
#  자리다 — `355_trajopt_exogenous_observation.md` `OBS-5`는 **성질**만 정했고
#  (고정 크기·O(1) 스왑·나이는 순서수·신선도 비트) 값은 안 정했다. 여기 값은
#  값 부재를 메꾸는 **가정**이지 사전등록된 정본이 아니다.
#
#  🔴 **이 값들로 만든 어떤 산출물도 논문 증거가 아니다.** `SC-*` 주장의
#  `evidence`로 계상하려면 실측 센서 스펙(실기 라이다 datasheet 또는 아이작 심
#  센서 에셋)으로 다시 돌려야 한다. run 기록에 "관측 파라미터 출처 = 가정"을
#  반드시 남긴다 — `config/scenario/README.md`의 `robot_specs.json`·
#  `config/trajopt.yaml`과 같은 규율(U48-5·U48-9 선례).
#
#  코드에는 어떤 센서 값도 박혀 있지 않다 — `observation_node.cpp`는 이 파일의
#  키가 없으면 `mrs_core::ContractViolation`으로 기동을 거부한다(값 0.0/999.0
#  등 sentinel만 코드에 있고, 그것도 "필수인데 없다"는 판정에만 쓰인다).
# =============================================================================
#
# ## 각 값의 출처 — 유도한 것·고른 것·근거 없는 것을 가른다
#
# | 키 | 값 | 출처 |
# |---|---|---|
# | `scan_range_min_m` | 0.05 | 🔴 **근거 없음** — 저가 실내 2D lidar의 통상 하한. `config/scenario/README.md`의 "소형 실내 AMR" 가정과 결은 맞지만 유도는 아니다 |
# | `scan_range_max_m` | 6.0 | 🟡 **선택**: `config/scenario/roadmap.json`의 최대 간선 `length_m`(5.0 m)보다 약간 크게 잡았다 — 미차단 구간에서 무한대(REP 105 "관측 없음")가 아니라 유한한 실수로 간극을 보여주는 것이 이 라운드의 증거 요구(수치로 보여라)에 맞기 때문. 물리 근거 아님 |
# | `scan_angle_min_rad` / `scan_angle_max_rad` | -1.5708 / 1.5708 (±90°) | 🔴 **근거 없음** — 전방 180° 부채꼴, 흔한 저가 2D lidar FOV의 상식적 규모 |
# | `scan_angle_increment_rad` | 0.3927 (22.5°, 9 샘플) | 🔴 **근거 없음** — 판독성·계산량 절충. 유도 아님 |
# | `forward_cone_half_angle_rad` | 0.2 (약 11.46°) | 🔴 **근거 없음** — `observation_node.cpp`가 "간선을 따라 보는" 레이(차단에 민감)와 "가로질러 보는" 레이(벽, 차단 무관)를 가르는 구현 문턱. 순수 엔지니어링 선택 — 물리 센서 사양이 아니다 |
# | `edge_lock_max_lateral_m` | 1.0 | 🔴 **근거 없음** — 로봇이 "이 간선 위에 있다"고 볼 측방 허용 오차. `config/scenario/roadmap.json` 간선 폭(1.2~2.4 m)의 절반 근방을 골랐을 뿐 유도 아님 |
# | `scan_publish_period_ms` | 100 | 🟡 **선택**: 제어 주기(50 ms, `multibot3/CLAUDE.md` 핵심 불변식 5)의 정수배로 골랐으나, `355` `OBS-5`가 "생산 주기는 제어 주기와 정수배 관계일 필요 없다 — 나이가 그것을 흡수한다"로 명시했으므로 **묶인 것이 아니라 우연**이다 |
#
# 🔴 **일곱 값 전부 근거 없음/선택이고 유도값은 0건이다** — 상류 물리 스펙이
# 없어 유도할 대상 자체가 없다(`scale.yaml`·`trajopt.yaml`과 다른 점).
# =============================================================================

observation_node:
  ros__parameters:
    scan_range_min_m: 0.05
    scan_range_max_m: 6.0
    scan_angle_min_rad: -1.5708
    scan_angle_max_rad: 1.5708
    scan_angle_increment_rad: 0.3927
    forward_cone_half_angle_rad: 0.2
    edge_lock_max_lateral_m: 1.0
    scan_publish_period_ms: 100
